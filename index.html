<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR 3D Business Card</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar.js"></script>
    <style>
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.25em;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">Point your camera at the marker</div>
    
    <a-scene 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Lighting for better 3D model appearance -->
        <a-entity light="type: ambient; color: #BBB; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="0 1 1"></a-entity>
        
        <a-marker type="pattern" url="addidas.patt">
            <!-- 3D Model -->
            <a-entity 
                gltf-model="model.glb" 
                animation-mixer"
                scale="0.5 0.5 0.5" 
                position="0 0.5 0" 
                rotation="0 0 0">
            </a-entity>
            
            <!-- Floating 3D Text -->
            <a-text 
                value="addidas"
                position="0 1.2 0" 
                color="#4361ee" 
                align="center" 
                width="3" 
                font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
            </a-text>
            
            <!-- Contact Info Text -->
            <a-text 
                value="contact@yourbusiness.com | +91 6300987030"
                position="0 0.8 0" 
                color="#333" 
                align="center" 
                width="3" 
                font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
            </a-text>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        // Hide loader when AR starts
        document.addEventListener('DOMContentLoaded', function() {
            const scene = document.querySelector('a-scene');
            scene.addEventListener('loaded', function() {
                document.querySelector('.arjs-loader').style.display = 'none';
            });
        });
    </script>
</body>
</html>
